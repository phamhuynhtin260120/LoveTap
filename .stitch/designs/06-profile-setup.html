<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Input Glow Focus */
        input:focus {
            outline: none;
            border-color: #F47C7C !important;
            box-shadow: 0 0 0 4px rgba(244, 124, 124, 0.1) !important;
        }

        /* Pillowy Button Gradient */
        .btn-pillowy {
            background: linear-gradient(180deg, #F47C7C 0%, #F8B4B4 100%);
            box-shadow: 0 4px 12px rgba(69, 45, 61, 0.08);
            transition: all 0.2s ease;
        }
        .btn-pillowy:active {
            box-shadow: inset 0 2px 4px rgba(69, 45, 61, 0.1);
            transform: translateY(1px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen font-body-md antialiased overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Navigation for Setup (Linear Flow, Back Button Only) -->
<header class="flex justify-between items-center px-margin-mobile md:px-margin-desktop h-16 w-full z-50 sticky top-0 bg-background/80 backdrop-blur-md">
<button aria-label="Back" class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 duration-200 p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<!-- Title omitted for cleaner linear flow, optional step indicator could go here -->
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="max-w-md mx-auto px-margin-mobile md:px-margin-desktop pt-xl pb-24 flex flex-col items-center">
<!-- Header Text -->
<div class="text-center mb-xl w-full">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-sm">
                Về bạn
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Hãy cho CHẠM biết một chút về bạn nhé.
            </p>
</div>
<!-- Avatar Picker -->
<div class="relative mb-xl group cursor-pointer">
<div class="w-32 h-32 rounded-full bg-surface-container border-4 border-surface-container-lowest shadow-[0_8px_24px_rgba(69,45,61,0.06)] flex items-center justify-center overflow-hidden transition-transform duration-300 group-active:scale-95">
<!-- Placeholder Image -->
<img alt="Avatar Preview" class="w-full h-full object-cover opacity-50" data-alt="A soft, aesthetically pleasing default avatar placeholder illustration. Features abstract, warm organic shapes in pastel coral and soft lavender tones against a creamy ivory background. The style is modern, minimalist, and emotional, reflecting a calm and intimate atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAfp3MKVYe4WfrD6kGICTzvXTpxh88MN-W4gxIJjOrywCdDdwNQEozCERs28s0bfjcOoSJkQV-TtqZE6Ej6s76rwz6zAYqwLBVnhA2WAuGgA74VFaJzVMb_m_hJWIg8zMSTne5l2Jg50W_eVqjhP9WPcDc0eNYhHKP5-RqOcSE7OKgsZz_yyavazI5cuRPm4SMyKcMftJAn2wtXUA86qLc_-5EQsqSMG2WGUfQrcgHnXiaiU7S4qtVjlQ"/>
<!-- Overlay Icon -->
<div class="absolute inset-0 flex items-center justify-center bg-black/10 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
<span class="material-symbols-outlined text-on-primary text-3xl icon-fill drop-shadow-md">add_a_photo</span>
</div>
</div>
<!-- Floating Add Icon -->
<button class="absolute bottom-0 right-0 w-10 h-10 bg-primary-container text-on-primary rounded-full shadow-md flex items-center justify-center hover:bg-primary-container/90 transition-colors">
<span class="material-symbols-outlined text-xl">camera_alt</span>
</button>
</div>
<!-- Form Fields -->
<div class="w-full space-y-lg">
<!-- Field 1 -->
<div class="flex flex-col space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="name">
                    Tên của bạn
                </label>
<div class="relative">
<input class="w-full bg-[#FFFDFC] border border-[#FFD7C2] rounded-xl px-md py-3 font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/40 transition-all duration-200" id="name" placeholder="Ví dụ: Nguyễn Văn A" type="text"/>
</div>
</div>
<!-- Field 2 -->
<div class="flex flex-col space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="nickname">
                    Người ấy sẽ gọi bạn là gì?
                </label>
<div class="relative">
<input class="w-full bg-[#FFFDFC] border border-[#FFD7C2] rounded-xl px-md py-3 font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/40 transition-all duration-200" id="nickname" placeholder="Ví dụ: Mèo con" type="text"/>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant/70 px-1 mt-1">
                    Tên này sẽ hiển thị trên màn hình của người ấy.
                </p>
</div>
</div>
<!-- Action Button Fixed at Bottom -->
<div class="fixed bottom-0 left-0 w-full p-margin-mobile bg-gradient-to-t from-background via-background/90 to-transparent z-40 flex justify-center pb-8">
<button class="w-full max-w-md btn-pillowy text-on-primary font-label-md text-label-md py-4 rounded-full flex items-center justify-center space-x-2">
<span>Tiếp tục</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</main>
