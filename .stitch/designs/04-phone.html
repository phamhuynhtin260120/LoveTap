<body class="bg-[#FFFDFC] text-on-surface antialiased min-h-screen flex flex-col font-sans selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Area -->
<main class="flex-1 flex flex-col w-full max-w-md mx-auto px-margin-mobile pt-16 pb-lg relative">
<!-- Back Button (Conceptual) -->
<div class="mb-xl">
<button class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-lowest border border-outline-variant/30 text-on-surface hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-headline-md">arrow_back</span>
</button>
</div>
<!-- Header -->
<div class="mb-xl text-center space-y-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary">Nhập số điện thoại</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-xs mx-auto">
                Chúng tôi sẽ gửi một mã xác nhận gồm 6 chữ số đến số điện thoại này.
            </p>
</div>
<!-- Input Form -->
<div class="space-y-lg flex-1">
<div class="soft-input rounded-card p-4 flex items-center gap-sm">
<!-- Country Code Selector (Simplified) -->
<button class="flex items-center gap-xs pr-4 border-r border-outline-variant/50 hover:bg-surface-container-low rounded-lg p-2 transition-colors">
<span class="text-xl">🇻🇳</span>
<span class="font-label-md text-label-md text-on-surface">+84</span>
<span class="material-symbols-outlined text-sm text-on-surface-variant">arrow_drop_down</span>
</button>
<!-- Phone Input -->
<input autocomplete="tel" class="flex-1 bg-transparent border-none outline-none font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 px-2" placeholder="Số điện thoại của bạn" type="tel"/>
</div>
</div>
<!-- Bottom Action -->
<div class="mt-auto pt-lg">
<button class="btn-primary w-full py-4 rounded-full font-label-md text-label-md text-on-primary flex items-center justify-center gap-sm">
                Nhận mã xác nhận
            </button>
</div>
</main>
<script>
        // Simple input focus interaction
        const inputField = document.querySelector('input[type="tel"]');
        
        // Auto-focus the input on load for immediate interaction
        window.onload = () => {
             setTimeout(() => {
                 inputField.focus();
             }, 300);
        };
    </script>
