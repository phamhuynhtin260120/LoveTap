<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            
            inputs.forEach((input, index) => {
                // Focus next input on type
                input.addEventListener('input', (e) => {
                    // Limit length to 1
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1);
                    }
                    
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                // Handle backspace
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
                
                // Allow paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').slice(0, inputs.length).replace(/\D/g, '');
                    if (pastedData) {
                        for (let i = 0; i < pastedData.length; i++) {
                            if (inputs[index + i]) {
                                inputs[index + i].value = pastedData[i];
                            }
                        }
                        const focusIndex = Math.min(index + pastedData.length, inputs.length - 1);
                        inputs[focusIndex].focus();
                    }
                });
            });

            // Timer Logic
            let timeLeft = 59;
            const timerEl = document.getElementById('timer');
            const resendBtn = document.getElementById('resend-btn');

            const timer = setInterval(() => {
                timeLeft--;
                const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerEl.textContent = `(00:${seconds})`;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    timerEl.style.display = 'none';
                    resendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    resendBtn.classList.add('hover:opacity-80');
                    resendBtn.disabled = false;
                }
            }, 1000);
            
            // First input focus
            if(inputs.length > 0) inputs[0].focus();
        });
    </script>
