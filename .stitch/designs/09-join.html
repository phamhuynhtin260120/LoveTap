<body class="bg-[#FFF9F5] text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 bg-transparent flex items-center justify-between px-margin-mobile py-md">
<button aria-label="Go back" class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-surface-variant transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-display text-display text-primary uppercase tracking-widest invisible">CHẠM</div> <!-- Hidden for balance if needed, or omit. Left aligned back is typical -->
<div class="w-12 h-12"></div> <!-- Spacer for flex-between balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile md:px-margin-desktop pt-xl pb-32 flex flex-col items-center justify-center w-full max-w-md mx-auto">
<!-- Heading & Subtext -->
<div class="text-center mb-xl w-full">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-sm">Nhập mã kết nối</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Nhập mã gồm 8 ký tự mà người ấy đã gửi cho bạn để bắt đầu không gian riêng.</p>
</div>
<!-- Input Area -->
<div class="w-full mb-xl">
<div class="bg-[#FFFDFC] rounded-[24px] p-md border border-[#FFD7C2] focus-within:border-primary-container focus-within:ring-4 focus-within:ring-primary-container/10 transition-all duration-300 shadow-[0_8px_24px_rgba(69,45,61,0.06)] relative flex items-center justify-center overflow-hidden group">
<!-- Stylized Input -->
<input class="w-full text-center bg-transparent border-none outline-none font-headline-md text-headline-md text-primary tracking-[0.2em] uppercase placeholder-on-surface-variant/30 focus:ring-0 z-10" id="connection-code" maxlength="9" placeholder="CHAM-XXXX" type="text"/>
<!-- Gentle ambient background shape for emotional feel -->
<div class="absolute inset-0 bg-gradient-to-br from-surface-container-highest/20 to-transparent opacity-0 group-focus-within:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
</div>
<p class="font-label-sm text-label-sm text-error mt-sm text-center opacity-0 transition-opacity duration-200" id="error-message">Mã không hợp lệ. Vui lòng thử lại.</p>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-md">
<!-- Primary Button -->
<button class="w-full py-md rounded-full bg-gradient-to-b from-[#F47C7C] to-[#F8B4B4] text-on-primary font-label-md text-label-md shadow-[0_8px_24px_rgba(69,45,61,0.06)] active:shadow-none active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-sm">
<span>Kết nối</span>
<span class="material-symbols-outlined text-[20px]" data-icon="favorite">favorite</span>
</button>
<!-- Secondary Action (Scan QR) -->
<button class="w-full py-md rounded-full bg-[#FFD7C2]/30 text-on-surface-variant font-label-md text-label-md active:bg-[#FFD7C2]/50 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-sm mt-sm border-none">
<span class="material-symbols-outlined text-[20px]" data-icon="qr_code_scanner">qr_code_scanner</span>
<span>Quét mã QR</span>
</button>
</div>
<!-- Subtle Decorative Element -->
<div class="mt-24 opacity-30 flex items-center justify-center pointer-events-none">
<span class="material-symbols-outlined text-4xl text-primary-container" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>

<script>
        // Simple input formatting (e.g., auto-capitalize and optional dash)
        const codeInput = document.getElementById('connection-code');
        codeInput.addEventListener('input', function(e) {
            let val = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
            // Optional: Auto-insert dash if you want strict format CHAM-XXXX
            // if (val.length > 4 && !val.includes('-')) {
            //     val = val.slice(0, 4) + '-' + val.slice(4);
            // }
            e.target.value = val;
        });
    </script>
