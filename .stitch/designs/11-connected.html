<style>
        .pulse-heart {

            50% { transform: scale(1.1) translateY(-45%); box-shadow: 0 0 0 15px rgba(244, 124, 124, 0); }
            100% { transform: scale(1) translateY(-50%); box-shadow: 0 0 0 0 rgba(244, 124, 124, 0); }

        .float-avatar-left {
            animation: floatLeft 6s ease-in-out infinite;
        }
        .float-avatar-right {
            animation: floatRight 6s ease-in-out infinite;
            animation-delay: -3s;
        }
        @keyframes floatLeft {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(-2deg); }
        }
        @keyframes floatRight {
            0%, 100% { transform: translateY(0) rotate(5deg); }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #f47c7c;
            border-radius: 50%;

<!-- Subtle interactive script for confetti -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#fdd8ed', '#ffb3b1', '#f47c7c', '#eaddff'];
            
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                
                // Randomize properties
                const left = Math.random() * 100 + 'vw';
                const duration = Math.random() * 3 + 4 + 's';
                const delay = Math.random() * 2 + 's';
                const size = Math.random() * 6 + 4 + 'px';
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                confetti.style.left = left;
                confetti.style.top = '-10px';
                confetti.style.animationDuration = duration;
                confetti.style.animationDelay = delay;
                confetti.style.width = size;
                confetti.style.height = size;
                confetti.style.backgroundColor = color;
                
                container.appendChild(confetti);
            }
        });
    </script>
